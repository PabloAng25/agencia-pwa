<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17142b">
  <title>Sin conexión | Agencia Creativa Visual</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 1.5rem; font-family: system-ui, -apple-system, sans-serif;
      color: #f5efff; background: radial-gradient(circle at 20% 20%, #3f255e, #17142b 70%); }
    main { width: min(100%, 32rem); text-align: center; padding: 2rem;
      border: 1px solid #ffffff38; border-radius: 1.3rem; background: #ffffff0d; }
    .icono { font-size: 3rem; line-height: 1; }
    h1 { margin-bottom: .5rem; }
    p { line-height: 1.6; color: #ded5ed; }
    a { display: inline-block; padding: .8rem 1.2rem; margin-top: .7rem;
      border-radius: .7rem; color: #17142b; background: #e8cffc; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid white; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="icono" aria-hidden="true">☁</div>
    <h1>Estás sin conexión</h1>
    <p>Esta página necesita Internet. Puedes volver al inicio y consultar los servicios
      y borradores de cotización que ya estén almacenados en tu dispositivo.</p>
    <a href="./">Volver al inicio</a>
  </main>
</body>
</html>
